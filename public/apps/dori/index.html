<style>
  html, body { margin:0; color:#3b1d14; font-family:"Rasa",Georgia,serif; -webkit-text-size-adjust:100%;

  .gate { min-height:100svh; display:grid; place-items:center; padding:24px 16px; box-sizing:border-box; }
  .gate form { position:relative; width:100%; max-width:380px; text-align:center; background:#fffaf0; border-radius:22px; overflow:hidden;

  .gate .toran { position:absolute; left:0; top:0; width:100%; height:78px; }
  .gate .inv { margin:0; font:600 15px/1 "Baloo Bhai 2",sans-serif; color:#b3122e; }
  .gate .ganesha { width:84px; height:auto; display:block; margin:12px auto 4px; }
  .gate h1 { margin:6px 0 0; font:800 46px/1.05 "Baloo Bhai 2",sans-serif; color:#b3122e; }
  .gate .k { margin:6px 0 0; font:600 13px/1 "Rasa",serif; letter-spacing:.28em; text-transform:uppercase; color:#8a5a1a; }
  .gate p.s { margin:14px 0 20px; font-size:17px; line-height:1.45; color:#5a3a2a; }
  .gate label { display:block; text-align:left; font-size:14px; font-weight:600; color:#5a3a2a; margin-bottom:6px; }
  .gate input { width:100%; box-sizing:border-box; font:600 18px/1 "Lora",serif; letter-spacing:.12em; text-transform:uppercase; text-align:center;
    color:#3b1d14; background:#fff; border:1.5px solid #e2c48e; border-radius:12px; padding:14px 12px; }
  .gate input:focus { outline:2px solid #b3122e; outline-offset:1px; border-color:#b3122e; }
  .gate button { margin-top:12px; width:100%; font:700 17px/1 "Rasa",serif; color:#fffaf0; background:#b3122e; border:0; border-radius:12px; padding:15px; cursor:pointer; }
  .gate button:disabled { opacity:.75; cursor:progress; }
  .gate .err { min-height:20px; margin:12px 0 0; font-size:15px; color:#b3122e; }
  .gate .swastik { width:26px; height:26px; display:block; margin:14px auto 0; }
  .gate .home { display:inline-block; margin-top:10px; font-size:14px; color:#8a6a50; }
  #app[hidden], .gate[hidden] { display:none; }
  html { scroll-behavior:smooth; }

    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" }, base,
      { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }

  // Fetch an encrypted file, reporting progress, then decrypt it.
  async function open(name, k, onProgress) {
    // Absolute, so the page works at /apps/dori and /apps/dori/ alike.
    const res = await fetch("/apps/dori/" + name, { cache: "no-store" });
    if (!res.ok) throw new Error("fetch");
    const total = Number(res.headers.get("content-length")) || 0;
    let buf;
    if (onProgress && res.body && total) {
      const reader = res.body.getReader();
      const out = new Uint8Array(total);
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        out.set(value, got);
        got += value.length;
        onProgress(got / total);
      }
      buf = out.subarray(0, got);
    } else {
      buf = new Uint8Array(await res.arrayBuffer());
    }
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.subarray(0, 12) }, k, buf.subarray(12));
  }

  async function unlock(code, remember) {
    const k = await deriveKey(code);
    const plain = await open("p.bin", k); // throws if the code is wrong
    key = k;
    const app = $("app");
    app.innerHTML = new TextDecoder().decode(plain);
    $("gate").hidden = true;
    app.hidden = false;
    const t = app.querySelector("[data-title]"); if (t) document.title = t.dataset.title;
    if (remember) { try { localStorage.setItem(STORE, code); } catch (e) {} }
    wire(app);
  }

  function wire(app) {
    // The film is the hero: start loading it as soon as the page opens, then play it muted.
    const film = app.querySelector("[data-film]");
    if (film) {
      const label = film.querySelector("[data-film-label]");
      const bar = film.querySelector("[data-film-bar]");
      const load = async () => {
        try {
          const plain = await open("f.bin", key, (p) => {
            bar.style.width = `${Math.round(p * 100)}%`;
            label.textContent = `Loading the film · ${Math.round(p * 100)}%`;
          });
          const video = document.createElement("video");
          video.src = URL.createObjectURL(new Blob([plain], { type: "video/mp4" }));
          video.muted = true; video.playsInline = true; video.autoplay = true; video.controls = true;
          video.setAttribute("playsinline", ""); video.setAttribute("muted", "");
          video.addEventListener("volumechange", () => film.classList.toggle("unmuted", !video.muted));
          film.querySelector("img").replaceWith(video);
          film.querySelector("[data-film-load]").remove();
          film.classList.add("ready");
          video.play().catch(() => {});
        } catch (e) {
          label.textContent = "Couldn't load the film. Tap to try again";
          film.addEventListener("click", load, { once: true });
        }
      };
      load();
      const sound = film.querySelector("[data-sound]");
      sound.addEventListener("click", () => {
        const v = film.querySelector("video");
        if (!v) return;
        v.muted = false; v.currentTime = 0; v.play().catch(() => {});
      });
    }

    // Days to go on each function.
    const today = new Date(); today.setHours(0, 0, 0, 0);
    app.querySelectorAll("[data-count]").forEach((el) => {
      const [y, m, d] = el.dataset.count.split("-").map(Number);
      const days = Math.round((new Date(y, m - 1, d) - today) / 86400000);
      el.textContent = days > 1 ? `${days} days to go` : days === 1 ? "Tomorrow" : days === 0 ? "Today" : "Done";
    });

    // Add a function to the phone's calendar (all-day; the app has the exact time and venue).
    app.querySelectorAll("[data-ics]").forEach((btn) => btn.addEventListener("click", () => {
      const d = btn.dataset.ics;
      const next = new Date(Date.UTC(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8) + 1)).toISOString().slice(0, 10).replace(/-/g, "");
      const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//DORI//Invite//EN", "BEGIN:VEVENT",
        `UID:dori-${d}@dashovia.com`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").slice(0, 15)}Z`,
        `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${next}`, `SUMMARY:${btn.dataset.icsTitle.replace(/([,;])/g, "\\$1")}`,
        "DESCRIPTION:Timings, venue and directions are in the DORI app.", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
      a.download = `dori-${d}.ics`;
      document.body.appendChild(a); a.click(); a.remove();
    }));

    // Highlight the function in view on the date rail.
    const rail = [...app.querySelectorAll("[data-rail]")];
    const scenes = [...app.querySelectorAll("[data-scene]")];
    let ticking = false;
    const mark = () => {
      ticking = false;
      const line = innerHeight * 0.4;
      const on = scenes.find((s) => { const r = s.getBoundingClientRect(); return r.top <= line && r.bottom > line; });
      rail.forEach((a) => a.setAttribute("aria-current", on && a.getAttribute("href") === `#${on.id}` ? "true" : "false"));
    };
    addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(mark); } }, { passive: true });
    mark();

    const apk = app.querySelector("[data-apk]");
    if (apk) apk.addEventListener("click", async () => {
      if (apk.getAttribute("aria-busy") === "true") return;
      const label = apk.querySelector("[data-apk-label]");
      apk.setAttribute("aria-busy", "true");
      try {
        const plain = await open("a.bin", key, (p) => { label.textContent = `Downloading ${Math.round(p * 100)}%`; });
        const url = URL.createObjectURL(new Blob([plain], { type: "application/vnd.android.package-archive" }));
        const a = document.createElement("a");
        a.href = url; a.download = "DORI.apk";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        label.textContent = "Downloaded. Open DORI.apk";
      } catch (e) {
        label.textContent = "Couldn't download. Tap to try again";
      }
      apk.removeAttribute("aria-busy");
    });

    const lock = app.querySelector("[data-lock]");
    if (lock) lock.addEventListener("click", () => {
      try { localStorage.removeItem(STORE); } catch (e) {}
      location.reload();
    });
  }

  $("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const code = norm($("code").value);
    const go = $("go");
    $("err").textContent = "";
    if (!code) return;
    go.disabled = true; go.textContent = "Opening…";
    try {
      await unlock(code, true);
    } catch (e) {
      $("err").textContent = e && e.name === "OperationError"
        ? "That code doesn't match. Check your invitation and try again."
        : "Couldn't load the invitation. Check your connection and try again.";
      go.disabled = false; go.textContent = "Open the invitation";
    }
  });

  let saved = null;
  try { saved = localStorage.getItem(STORE); } catch (e) {}
  if (saved) unlock(saved, false).catch(() => { try { localStorage.removeItem(STORE); } catch (e) {} });
})();
</script>
</body>
</html>
